[package]
name = "mdread"
version = "0.1.0"
description = "Fast local Markdown reader"
edition = "2021"
rust-version = "1.90"

[lib]
name = "mdread_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html", "simd"] }
notify = "8.2"
notify-debouncer-mini = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
